  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#fff;
      --text:#555;
      --muted:#999;
      --line:#e5e5e5;
      --soft:#f7f7f7;
      --max:1180px;
      --sidebar:180px;
      --font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Apple SD Gothic Neo","Pretendard",Arial,sans-serif;
    }
    html{scroll-behavior:smooth}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
      font-size:13px;
      line-height:1.7;
      font-weight:400;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
    img{display:block;max-width:100%}

    /* ─────────────────────────────────────
       전체 구조
    ───────────────────────────────────── */
    .site{
      width:min(var(--max),calc(100% - 80px));
      margin:0 auto;
      min-height:100vh;
      display:grid;
      grid-template-columns:var(--sidebar) minmax(0,1fr);
      column-gap:70px;
    }

    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      padding-top:46px;
      display:flex;
      flex-direction:column;
    }
    .brand{
      font-size:14px;
      letter-spacing:.04em;
      color:#777;
      margin-bottom:88px;
      white-space:nowrap;
    }
    .brand-sub{
      display:block;
      margin-top:2px;
      font-size:9px;
      letter-spacing:.20em;
      color:#aaa;
    }
    .menu{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:9px;
    }
    .menu button,.menu a{
      font-size:12px;
      color:#999;
      line-height:1.4;
      transition:color .2s ease;
      text-align:left;
    }
    .menu button:hover,.menu a:hover,.menu button.active{color:#444}
    .icon-link{display:inline-flex;align-items:center}
    .sidebar-bottom{
      margin-top:auto;
      padding-bottom:34px;
      font-size:10px;
      color:#bbb;
      line-height:1.6;
    }
    .sidebar-bottom a{display:inline-block;margin-top:5px;color:#aaa}
    .sidebar-bottom a:hover{color:#555}

    main{min-width:0;padding-bottom:80px}

    /* ─────────────────────────────────────
       홈 / 메인 이미지
    ───────────────────────────────────── */
    .home{
      min-height:100vh;
      padding:52px 0 60px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .hero-image{
      width:min(760px,100%);
      height:min(72vh,720px);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fafafa;
      overflow:hidden;
      cursor:pointer;
    }
    .hero-image img{
      width:100%;
      height:100%;
      object-fit:contain;
      transition:opacity .35s ease;
    }
    .hero-empty{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#bbb;
      font-size:11px;
      letter-spacing:.08em;
    }
    .hero-caption{
      width:min(760px,100%);
      margin:14px auto 0;
      display:flex;
      justify-content:space-between;
      gap:20px;
      font-size:10px;
      color:#aaa;
    }
    .hero-caption strong{
      font-weight:400;
      color:#777;
    }

    /* ─────────────────────────────────────
       공통 섹션
    ───────────────────────────────────── */
    .section{
      padding:115px 0 40px;
      scroll-margin-top:20px;
    }
    .section-head{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      padding-bottom:10px;
      margin-bottom:24px;
    }
    .section-title{
      font-size:13px;
      font-weight:400;
      color:#666;
      letter-spacing:.02em;
    }
    .section-count{
      font-size:10px;
      color:#aaa;
    }
    .section-title.back-link{transition:color .2s ease}
    .section-title.back-link:hover{color:#333}

    /* ─────────────────────────────────────
       작품
    ───────────────────────────────────── */
    .year-filter{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom:28px;
    }
    .year-filter button{
      font-size:10px;
      color:#aaa;
      padding:0;
    }
    .year-filter button:hover,.year-filter button.on{color:#444}

    .works-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:34px 18px;
    }
    .work-card{cursor:pointer}
    .work-image{
      width:100%;
      aspect-ratio:3/4;
      background:#f7f7f7;
      overflow:hidden;
    }
    .work-image img,.work-image svg{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:opacity .25s ease;
    }
    .work-card:hover .work-image img{opacity:.78}
    .work-info{padding-top:9px}
    .work-title{
      font-size:11px;
      color:#666;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .work-meta{
      margin-top:1px;
      font-size:10px;
      color:#aaa;
    }
    .empty{
      grid-column:1/-1;
      padding:35px 0;
      color:#aaa;
      font-size:11px;
    }


    /* ─────────────────────────────────────
       CV
    ───────────────────────────────────── */
    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:70px;
    }
    .cv-about-grid{
      align-items:start;
    }
    .info-block + .info-block{margin-top:42px}
    .info-title{
      font-size:9px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#aaa;
      border-bottom:1px solid var(--line);
      padding-bottom:8px;
      margin-bottom:14px;
    }
    .cv-row{
      display:grid;
      grid-template-columns:48px 1fr;
      gap:10px;
      margin-bottom:13px;
    }
    .cv-year{font-size:10px;color:#aaa}
    .cv-title{font-size:11px;color:#666}
    .cv-loc{font-size:10px;color:#aaa}
    .contact{
      margin-top:30px;
      padding-top:15px;
      border-top:1px solid var(--line);
    }
    .contact-row{
      display:grid;
      grid-template-columns:75px 1fr;
      margin-bottom:5px;
      font-size:10px;
    }
    .contact-label{color:#aaa}
    .contact-value{color:#777}
    .contact-value:hover{color:#444}

    /* ─────────────────────────────────────
       Contact
    ───────────────────────────────────── */
    .contact-page{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .contact-center{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .contact-email{
      display:inline-flex;
      align-items:center;
      gap:14px;
      color:#777;
      font-size:12px;
      text-decoration:underline;
      text-underline-offset:2px;
    }
    .contact-mail-icon{
      font-size:18px;
      line-height:1;
      text-decoration:none;
      color:#555;
    }

    /* ─────────────────────────────────────
       Footer
    ───────────────────────────────────── */
    footer{
      border-top:1px solid var(--line);
      margin-top:100px;
      padding:18px 0 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:9px;
      color:#bbb;
    }
    footer a:hover{color:#555}

    /* ─────────────────────────────────────
       전시 상세
    ───────────────────────────────────── */
    .panel-hero{
      width:100%;
      background:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .panel-hero img{width:100%;max-height:70vh;object-fit:contain}
    .panel-content{padding:32px 0 60px}
    .panel-type{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#aaa}
    .panel-title{margin-top:5px;font-size:20px;font-weight:400;color:#555}
    .panel-info{margin-top:22px;border-top:1px solid var(--line)}
    .panel-info-row{
      display:grid;
      grid-template-columns:70px 1fr;
      gap:12px;
      padding:10px 0;
      border-bottom:1px solid #f0f0f0;
      font-size:11px;
    }
    .panel-info-label{color:#aaa}
    .panel-info-value{color:#666}
    .panel-divider{height:1px;background:var(--line);margin:30px 0}
    .panel-subtitle{
      font-size:9px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#aaa;
      margin-bottom:12px;
    }
    .panel-text{font-size:12px;line-height:2;color:#777}
    .panel-gallery{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .panel-gallery-item{background:#f7f7f7;cursor:pointer}
    .panel-gallery-item img{width:100%;aspect-ratio:4/3;object-fit:cover}
    .panel-placeholder{
      aspect-ratio:4/3;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#bbb;
      font-size:10px;
    }

    /* ─────────────────────────────────────
       라이트박스
    ───────────────────────────────────── */
    .lightbox{
      position:fixed;
      inset:0;
      z-index:2000;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.97);
    }
    .lightbox.open{display:flex;cursor:pointer}
    .lb-image-wrap{position:relative;z-index:1;
      width:82vw;
      height:82vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .lb-image{
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
    }
    .lb-image.slide-left{animation:lbSlideLeft .28s cubic-bezier(.4,0,.2,1) forwards}
    .lb-image.slide-right{animation:lbSlideRight .28s cubic-bezier(.4,0,.2,1) forwards}
    @keyframes lbSlideLeft{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes lbSlideRight{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
    .lb-close{z-index:3;
      position:fixed;
      top:20px;
      right:24px;
      color:#999;
      font-size:10px;
      letter-spacing:.08em;
    }
    .lb-close:hover{color:#444}
    .lb-arrow{z-index:3;
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      width:40px;
      height:40px;
      color:#aaa;
      font-size:18px;
    }
    .lb-arrow:hover{color:#444}
    .lb-prev{left:18px}
    .lb-next{right:18px}
    .lb-info{z-index:2;
      position:fixed;
      bottom:22px;
      left:0;
      right:0;
      text-align:center;
      font-size:10px;
      color:#aaa;
      pointer-events:none;
    }
    .lb-title{color:#555}
    .lb-meta{margin-top:3px;color:#999}
    .lb-counter{margin-top:2px;color:#aaa}


    /* ─────────────────────────────────────
       페이지 전환형 레이아웃
    ───────────────────────────────────── */
    .page{
      display:none;
      min-height:100vh;
      animation:pageIn .28s ease both;
    }
    .page.active{display:block}
    @keyframes pageIn{
      from{opacity:0;transform:translateY(6px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* Landing */
    .home{
      min-height:100vh;
      padding:46px 0 34px;
      display:none;
      align-items:center;
      justify-content:center;
    }
    .home.active{display:flex}
    .landing{
      width:100%;
      min-height:calc(100vh - 80px);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .landing-images{
      width:100%;
      height:min(78vh,760px);
      display:grid;
      grid-template-columns:repeat(12,minmax(0,1fr));
      grid-template-rows:repeat(8,minmax(0,1fr));
      gap:3px;
      overflow:hidden;
    }
    .landing-item{
      position:relative;
      min-width:0;
      min-height:0;
      background:#f7f7f7;
      overflow:hidden;
      cursor:default;
    }
    .landing-item img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .landing-item:nth-child(1){grid-column:1 / span 5;grid-row:1 / span 8}
    .landing-item:nth-child(2){grid-column:6 / span 4;grid-row:1 / span 4}
    .landing-item:nth-child(3){grid-column:10 / span 3;grid-row:1 / span 4}
    .landing-item:nth-child(4){grid-column:6 / span 3;grid-row:5 / span 4}
    .landing-item:nth-child(5){grid-column:9 / span 4;grid-row:5 / span 4}
    .landing-empty{
      grid-column:1/-1;
      grid-row:1/-1;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#bbb;
      font-size:10px;
      letter-spacing:.08em;
      background:#fafafa;
    }
    .landing-note{
      width:100%;
      margin-top:12px;
      display:flex;
      justify-content:center;
      font-size:9px;
      color:#aaa;
      letter-spacing:.04em;
    }
    .landing-note span{color:#bbb}

    /* Page content: one screen at a time */
    .section{
      min-height:100vh;
      padding:46px 0 60px;
    }
    .section-head{
      margin-bottom:30px;
    }

    /* Prevent old hero rules from affecting the landing collage */
    .hero-image{cursor:default}
    .hero-caption{display:none}

    @media(max-width:900px){
      .landing{
        min-height:calc(100vh - 120px);
      }
      .landing-images{
        height:min(70vh,620px);
        gap:3px;
      }
      .section{
        min-height:calc(100vh - 100px);
        padding-top:40px;
      }
    }

    @media(max-width:900px){
      .site{
        width:min(100% - 36px,760px);
        grid-template-columns:1fr;
        display:block;
      }
      .sidebar{
        position:relative;
        height:auto;
        padding-top:24px;
        display:block;
      }
      .brand{margin-bottom:20px}
      .menu{
        flex-direction:row;
        flex-wrap:wrap;
        gap:6px 16px;
        padding-bottom:18px;
        border-bottom:1px solid var(--line);
      }
      .sidebar-bottom{display:none}
      main{padding-bottom:50px}
      .home{min-height:auto;padding:35px 0 70px}
      .hero-image{height:min(68vh,620px)}
      .section{padding-top:80px}
      .works-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}
      .exhibitions,.info-grid{grid-template-columns:1fr;gap:45px}
      footer{margin-top:70px}
    }

    @media(max-width:520px){
      body{font-size:12px}
      .site{width:calc(100% - 28px)}
      .brand{font-size:13px}
      .menu{gap:5px 13px}
      .menu button,.menu a{font-size:11px}
      .hero-image{height:62vh}
      .hero-caption{font-size:9px}
      .works-grid{grid-template-columns:1fr 1fr}
      .panel-content{padding:25px 20px 45px}
      .lb-image-wrap{position:relative;z-index:1;width:92vw;height:78vh}
      .lb-arrow{z-index:3;display:none}
    }
  </style>
</head>

<body>
  <div class="site">
    <aside class="sidebar">
      <div>
        <a href="#home" class="brand">
          So Beomsoo
          <span class="brand-sub">소 범 수</span>
        </a>

        <nav class="menu" aria-label="주 메뉴">
          <button class="active" data-target="home">Home</button>
          <button data-target="works-section">Works</button>
          <button data-target="cv-about-section">CV</button>
          <button data-target="contact-section">Contact</button>
          <a href="https://www.instagram.com/sobeomsoo/" target="_blank" rel="noopener" class="icon-link" aria-label="Instagram">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <div>© 2026 So Beomsoo</div>
        <a href="mailto:" id="sidebar-email">Contact</a>
      </div>
    </aside>

    <main>
      <section class="home page active" id="home">
        <div class="landing">
          <div class="landing-images" id="hero-image">
            <div class="hero-empty">LOADING</div>
          </div>
          <div class="landing-note">
            <span id="landing-index"></span>
          </div>
        </div>
      </section>

      <section class="section page" id="works-section">
        <div class="section-head">
          <h2 class="section-title">Works</h2>
          <span class="section-count" id="works-count"></span>
        </div>

        <div class="year-filter">
          <button class="on" onclick="filterWorks('all',this)">All</button>
          <button onclick="filterWorks('2026',this)">2026</button>
          <button onclick="filterWorks('2025',this)">2025</button>
          <button onclick="filterWorks('2024',this)">2024</button>
          <button onclick="filterWorks('2023',this)">2023</button>
        </div>

        <div class="works-grid" id="works-grid"></div>
      </section>

      <section class="section page" id="cv-about-section">
        <div class="section-head">
          <h2 class="section-title">CV</h2>
          <span class="section-count">Curriculum Vitae</span>
        </div>

        <div class="info-grid cv-about-grid">
          <div>
            <div class="info-block">
              <div class="info-title">Education</div>
              <div id="cv-education"></div>
            </div>

            <div class="info-block">
              <div class="info-title">Exhibitions</div>
              <div id="cv-exhibitions"></div>
            </div>
          </div>

          <div>
            <div class="info-block">
              <div class="info-title">Awards & Residencies</div>
              <div id="cv-awards"></div>
            </div>

            <div class="info-block">
              <div class="info-title">Press & Publications</div>
              <div id="cv-press"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="section page contact-page" id="contact-section">
        <div class="contact-center">
          <a class="contact-email" id="contact-email" href="mailto:">
            <span class="contact-mail-icon">✉</span>
            <span id="contact-email-text"></span>
          </a>
        </div>
      </section>

      <section class="section page" id="exhibition-detail-section">
        <div class="section-head">
          <button class="section-title back-link" onclick="closePanel()">← CV로 돌아가기</button>
          <span class="section-count" id="panel-type"></span>
        </div>

        <div class="panel-hero" id="panel-hero"></div>
        <div class="panel-content">
          <h2 class="panel-title" id="panel-title"></h2>

          <div class="panel-info">
            <div class="panel-info-row">
              <span class="panel-info-label">기간</span>
              <span class="panel-info-value" id="panel-period"></span>
            </div>
            <div class="panel-info-row">
              <span class="panel-info-label">장소</span>
              <span class="panel-info-value" id="panel-venue"></span>
            </div>
            <div class="panel-info-row">
              <span class="panel-info-label">참여작가</span>
              <span class="panel-info-value" id="panel-artists"></span>
            </div>
          </div>

          <div class="panel-divider"></div>
          <div class="panel-subtitle">전시 서문</div>
          <div class="panel-text" id="panel-intro"></div>

          <div class="panel-divider"></div>
          <div class="panel-subtitle">전시 전경</div>
          <div class="panel-gallery" id="panel-gallery"></div>
        </div>
      </section>

      <footer>
        <span>© 2026 So Beomsoo. All rights reserved.</span>
        <a href="https://www.instagram.com/sobeomsoo/" target="_blank" rel="noopener" class="icon-link" aria-label="Instagram">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
      </footer>
    </main>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">Close ×</button>
    <button class="lb-arrow lb-prev" onclick="event.stopPropagation();lbGo(-1)">←</button>
    <div class="lb-image-wrap">
      <img class="lb-image" id="lb-image" src="" alt="" onclick="event.stopPropagation()">
    </div>
    <button class="lb-arrow lb-next" onclick="event.stopPropagation();lbGo(1)">→</button>
    <div class="lb-info">
      <div class="lb-title" id="lb-title"></div>
      <div class="lb-meta" id="lb-meta"></div>
      <div class="lb-counter" id="lb-counter"></div>
    </div>
  </div>

<script>
  /* ─────────────────────────────────────
     Supabase
  ───────────────────────────────────── */
  const SUPABASE_URL = 'https://jytyhonnmtqukdisdyjh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_UOYI0mk2h_xtqJZmj1pvEA_1Veb2QI4';

  async function sb(table, query=''){
    try{
      const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}&order=created_at.desc`,{
        headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
      });
      return res.ok?await res.json():[];
    }catch(e){return []}
  }

  async function sbSingle(table,query=''){
    try{
      const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}&limit=1`,{
        headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
      });
      const data=res.ok?await res.json():[];
      return data[0]||null;
    }catch(e){return null}
  }

  function thumbUrl(url,width){
    if(!url||typeof url!=='string')return url;
    if(!url.includes('/storage/v1/object/public/'))return url;
    return url.replace('/object/public/','/render/image/public/')+`?width=${width}&quality=78&resize=contain`;
  }

  const PH_COLORS=[
    ['#E7E7E7','#D1D1D1','#F0F0F0'],
    ['#EAEAEA','#D5D5D5','#F2F2F2'],
    ['#E5E5E5','#CFCFCF','#EEEEEE']
  ];

  function makePh(c){
    return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <rect width="300" height="400" fill="${c[0]}"/>
      <ellipse cx="180" cy="160" rx="120" ry="100" fill="${c[1]}" opacity=".55"/>
      <rect x="20" y="280" width="260" height="80" fill="${c[2]}" opacity=".5"/>
      <ellipse cx="70" cy="100" rx="55" ry="70" fill="${c[2]}" opacity=".4"/>
    </svg>`;
  }

  /* ─────────────────────────────────────
     Hero
  ───────────────────────────────────── */
  let WORKS=[];
  let EXHIBITIONS=[];
  let currentWorks=[];
  let ALL_WORKS=[];

  function sortWorksByYearDesc(arr){
    return [...arr].sort((a,b)=>String(b.year||'').localeCompare(String(a.year||'')));
  }

  function shuffleArray(arr){
    const copy=[...arr];
    for(let i=copy.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }

  function renderHero(works){
    const el=document.getElementById('hero-image');
    const candidates=[];

    (works||[]).forEach(w=>{
      const imgs=Array.isArray(w.images)&&w.images.length?w.images:(w.img?[w.img]:[]);
      if(imgs[0]) candidates.push({
        src:imgs[0],
        title:w.title||'',
        meta:[w.year,w.medium,w.size].filter(Boolean).join(' · '),
        images:imgs,
        workRef:w
      });
    });

    if(!candidates.length){
      el.innerHTML='<div class="landing-empty">NO IMAGE</div>';
      document.getElementById('landing-index').textContent='';
      return;
    }

    const item=shuffleArray(candidates)[0];
    const workIndex=ALL_WORKS.indexOf(item.workRef);
    el.innerHTML=`
      <div class="landing-item" style="grid-column:1/-1;grid-row:1/-1;background:#fff" onclick="openLightbox(${JSON.stringify(item.images)},${JSON.stringify(item.title)},${JSON.stringify(item.meta)},${workIndex},'home','all')">
        <img src="${thumbUrl(item.src,1400)}" alt="${item.title||'So Beomsoo'}" style="object-fit:contain" loading="eager">
      </div>
    `;

    document.getElementById('landing-index').textContent=item.title||'';
  }

  /*
     Works
  ───────────────────────────────────── */
  function renderWorks(){
    const filter=document.querySelector('.year-filter button.on')?.textContent||'All';
    currentWorks=filter==='All'
      ? [...WORKS]
      : WORKS.filter(w=>String(w.year)===filter);

    currentWorks=sortWorksByYearDesc(currentWorks);

    document.getElementById('works-count').textContent=`${currentWorks.length}`;

    const grid=document.getElementById('works-grid');
    if(!currentWorks.length){
      grid.innerHTML='<div class="empty">등록된 작품이 없습니다.</div>';
      return;
    }

    grid.innerHTML=currentWorks.map((w,i)=>{
      const imgs=Array.isArray(w.images)&&w.images.length?w.images:(w.img?[w.img]:[]);
      const src=imgs[0]?thumbUrl(imgs[0],700):'';
      const c=PH_COLORS[i%PH_COLORS.length];
      const visual=src
        ? `<img src="${src}" alt="${w.title||''}" loading="lazy" onerror="this.outerHTML='${makePh(c).replace(/'/g,"\\'").replace(/\n/g,'')}'">`
        : makePh(c);

      return `<article class="work-card" onclick="openWork(${i})">
        <div class="work-image">${visual}</div>
        <div class="work-info">
          <div class="work-title">${w.title||''}</div>
          <div class="work-meta">${[w.year,w.medium,w.size].filter(Boolean).join(' · ')}</div>
        </div>
      </article>`;
    }).join('');
  }

  function filterWorks(year,button){
    document.querySelectorAll('.year-filter button').forEach(b=>b.classList.remove('on'));
    button.classList.add('on');
    renderWorks();
  }

  function openWork(index){
    const w=currentWorks[index];
    if(!w)return;
    const images=Array.isArray(w.images)&&w.images.length?w.images:(w.img?[w.img]:[]);
    openLightbox(images,w.title||'',[w.year,w.medium,w.size].filter(Boolean).join(' · '),index,'works-section');
  }

  /* ─────────────────────────────────────
     Exhibitions
  ───────────────────────────────────── */
  function openPanel(id){
    const e=EXHIBITIONS.find(x=>String(x.id)===String(id));
    if(!e)return;

    const hero=document.getElementById('panel-hero');
    const gallery=Array.isArray(e.gallery)?e.gallery.filter(Boolean):[];
    const allImages=[e.hero_img,...gallery].filter(Boolean);

    if(e.hero_img){
      hero.innerHTML=`<img src="${thumbUrl(e.hero_img,1000)}" alt="${e.title||''}">`;
      hero.style.cursor='pointer';
      hero.onclick=()=>openLightbox(allImages,e.title||'',e.period||'',-1,'exhibition-detail-section');
    }else{
      hero.innerHTML='<div class="panel-placeholder" style="width:100%;height:280px">전시 이미지 없음</div>';
      hero.style.cursor='default';
      hero.onclick=null;
    }

    const type={solo:'Solo Exhibition',group:'Group Exhibition',upcoming:'Current'}[e.type]||e.type;
    document.getElementById('panel-type').textContent=type||'';
    document.getElementById('panel-title').textContent=e.title||'';
    document.getElementById('panel-period').textContent=e.period||'—';
    document.getElementById('panel-venue').textContent=e.venue||'—';
    document.getElementById('panel-artists').textContent=e.artists||'—';
    document.getElementById('panel-intro').innerHTML=(e.intro||'—').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

    const galleryEl=document.getElementById('panel-gallery');
    if(gallery.length){
      galleryEl.innerHTML=gallery.map((src,i)=>`
        <div class="panel-gallery-item" onclick="openLightbox(${JSON.stringify(allImages)},${JSON.stringify(e.title||'')},${JSON.stringify(e.period||'')},-1,'exhibition-detail-section')">
          <img src="${thumbUrl(src,600)}" alt="전시 전경" loading="lazy">
        </div>
      `).join('');
    }else{
      galleryEl.innerHTML='<div class="panel-placeholder">이미지 없음</div><div class="panel-placeholder">이미지 없음</div>';
    }

    showPage('exhibition-detail-section');
  }

  function closePanel(){
    if(!document.getElementById('exhibition-detail-section').classList.contains('active'))return;
    showPage('cv-about-section');
  }

  /* ─────────────────────────────────────
     CV
  ───────────────────────────────────── */
  async function loadCv(){
    const items=await sb('cv_items');
    const groups={education:[],awards:[],press:[]};
    items.forEach(c=>{if(groups[c.type])groups[c.type].push(c)});
    const labels={
      education:'Education',
      awards:'Awards & Residencies',
      press:'Press & Publications'
    };

    ['education','awards','press'].forEach(type=>{
      const el=document.getElementById('cv-'+type);
      const list=groups[type]||[];
      el.innerHTML=list.length
        ? list.map(c=>`
            <div class="cv-row">
              <span class="cv-year">${c.year||''}</span>
              <div>
                <div class="cv-title">${c.title||''}</div>
                <div class="cv-loc">${c.loc||''}</div>
              </div>
            </div>`).join('')
        : `<div class="cv-row"><span class="cv-year">—</span><div class="cv-title" style="color:#aaa">등록된 항목이 없습니다.</div></div>`;
    });

    const exhEl=document.getElementById('cv-exhibitions');
    const exhibitions=[...(EXHIBITIONS||[])].sort((a,b)=>String(b.year||'').localeCompare(String(a.year||'')));
    exhEl.innerHTML=exhibitions.length
      ? exhibitions.map(e=>`
          <div class="cv-row" style="cursor:pointer" onclick="openPanel('${String(e.id).replace(/'/g,"\\'")}')">
            <span class="cv-year">${e.year||''}</span>
            <div>
              <div class="cv-title">${e.title||''}</div>
              <div class="cv-loc">${[e.venue,e.type==='solo'?'Solo Exhibition':e.type==='group'?'Group Exhibition':e.type==='upcoming'?'Current':''].filter(Boolean).join(' · ')}</div>
            </div>
          </div>`).join('')
      : `<div class="cv-row"><span class="cv-year">—</span><div class="cv-title" style="color:#aaa">등록된 전시가 없습니다.</div></div>`;
  }

  /* ─────────────────────────────────────
     Contact
  ───────────────────────────────────── */
  async function loadContact(){
    const a=await sbSingle('about');
    if(!a)return;
    if(a.email){
      document.getElementById('contact-email-text').textContent=a.email;
      document.getElementById('contact-email').href=`mailto:${a.email}`;
      document.getElementById('sidebar-email').href=`mailto:${a.email}`;
      document.getElementById('sidebar-email').textContent=a.email;
    }
  }

  /* ─────────────────────────────────────
     Lightbox
  ───────────────────────────────────── */
  let lbImages=[];
  let lbIndex=0;
  let lbWorkIndex=-1;
  let lbWorksList=[];
  let lbReturnPage='home';
  let lbMeta='';

  function openLightbox(images,title,meta='',index=-1,returnPage=null,worksSource='current'){
    lbImages=Array.isArray(images)?images.filter(Boolean):(images?[images]:[]);
    lbIndex=0;
    lbWorkIndex=index;
    lbWorksList=worksSource==='all'?ALL_WORKS:currentWorks;
    lbMeta=meta||'';
    lbReturnPage=returnPage || (index>=0 ? 'works-section' : (document.getElementById('cv-about-section')?.classList.contains('active') ? 'cv-about-section' : 'home'));
    document.getElementById('lb-title').textContent=title||'';
    document.getElementById('lb-meta').textContent=lbMeta;
    renderLb();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow='hidden';
    history.pushState({modal:'lightbox',returnPage:lbReturnPage},'',location.href);
  }

  function renderLb(dir){
    const img=document.getElementById('lb-image');
    img.classList.remove('slide-left','slide-right');
    img.src=lbImages[lbIndex]?lbImages[lbIndex]:'';
    img.alt=document.getElementById('lb-title').textContent||'';
    if(dir===1){void img.offsetWidth;img.classList.add('slide-left');}
    else if(dir===-1){void img.offsetWidth;img.classList.add('slide-right');}
    document.getElementById('lb-meta').textContent=lbMeta;
    document.getElementById('lb-counter').textContent=lbImages.length>1?`${lbIndex+1} / ${lbImages.length}`:'';

    const hasPrev=lbIndex>0 || (lbWorkIndex>0);
    const hasNext=lbIndex<lbImages.length-1 || (lbWorkIndex>=0 && lbWorkIndex<lbWorksList.length-1);
    document.querySelector('.lb-prev').style.visibility=hasPrev?'visible':'hidden';
    document.querySelector('.lb-next').style.visibility=hasNext?'visible':'hidden';
  }

  function lbGo(dir){
    if(!lbImages.length)return;

    const next=lbIndex+dir;
    if(next>=0&&next<lbImages.length){
      lbIndex=next;
      renderLb(dir);
      return;
    }

    if(lbWorkIndex>=0){
      const nextWork=lbWorkIndex+dir;
      if(nextWork<0||nextWork>=lbWorksList.length)return;
      const w=lbWorksList[nextWork];
      const imgs=Array.isArray(w.images)&&w.images.length?w.images:(w.img?[w.img]:[]);
      lbWorkIndex=nextWork;
      lbImages=imgs;
      lbIndex=dir>0?0:Math.max(imgs.length-1,0);
      document.getElementById('lb-title').textContent=w.title||'';
      renderLb(dir);
    }
  }

  function finishLightbox(returnToPage=lbReturnPage){
    const lb=document.getElementById('lightbox');
    if(!lb.classList.contains('open'))return;
    lb.classList.remove('open');
    document.body.style.overflow='';
    if(returnToPage==='works-section' || returnToPage==='cv-about-section' || returnToPage==='home' || returnToPage==='exhibition-detail-section') {
      showPage(returnToPage, true, false); // false = 스크롤 위치 유지
    }
  }

  function closeLightbox(){
    finishLightbox(lbReturnPage);
  }

  function lightboxBackgroundClick(e){
    finishLightbox(lbReturnPage);
  }

  /* ─────────────────────────────────────
     Navigation / page routing
  ───────────────────────────────────── */
  const pages=['home','works-section','cv-about-section','contact-section','exhibition-detail-section'];
  const navButtons=[...document.querySelectorAll('.menu [data-target]')];

  function showPage(target, updateHash=true, resetScroll=true){
    if(!pages.includes(target)) target='home';

    pages.forEach(id=>{
      const page=document.getElementById(id);
      if(page)page.classList.toggle('active',id===target);
    });

    navButtons.forEach(b=>{
      b.classList.toggle('active',b.dataset.target===target);
    });

    if(target==='home' && WORKS.length){
      renderHero(WORKS); // Home에 진입할 때마다 랜덤 이미지 다시 뽑기
    }

    if(updateHash){
      const hash=target==='home'?'':'#'+target.replace('-section','');
      if(location.hash!==hash){
        history.pushState({page:target},'',hash||location.pathname);
      }
    }

    if(resetScroll) window.scrollTo(0,0);
  }

  navButtons.forEach(btn=>{
    btn.addEventListener('click',()=>showPage(btn.dataset.target));
  });

  // Brand always returns to the landing page.
  document.querySelector('.brand').addEventListener('click',e=>{
    e.preventDefault();
    showPage('home');
  });

  function pageFromHash(){
    const key=location.hash.replace('#','');
    if(!key)return 'home';
    if(key==='works')return 'works-section';
    if(key==='exhibition' || key==='exhibition-detail')return 'cv-about-section';
    if(key==='cv' || key==='cv-about')return 'cv-about-section';
    if(key==='contact' || key==='about')return 'contact-section';
    return 'home';
  }

  window.addEventListener('hashchange',()=>{
    // Ignore hash changes caused by modal (lightbox) history entries.
    if(document.getElementById('lightbox').classList.contains('open')) return;
    showPage(pageFromHash(),false);
  });

  window.addEventListener('popstate',()=>{
    const lb=document.getElementById('lightbox');
    if(lb.classList.contains('open')){
      lb.classList.remove('open');
      document.body.style.overflow='';
      return;
    }
    showPage(pageFromHash(),false);
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(document.getElementById('lightbox').classList.contains('open'))closeLightbox();
    }
    if(document.getElementById('lightbox').classList.contains('open')){
      if(e.key==='ArrowLeft')lbGo(-1);
      if(e.key==='ArrowRight')lbGo(1);
    }
  });

  document.getElementById('lightbox').addEventListener('click',lightboxBackgroundClick);

  /* 라이트박스 터치 스와이프로 이미지 넘기기 */
  (function initLbTouch(){
    let touchStartX=0,touchStartY=0;
    const lb=document.getElementById('lightbox');
    lb.addEventListener('touchstart',e=>{
      touchStartX=e.touches[0].clientX;
      touchStartY=e.touches[0].clientY;
    },{passive:true});
    lb.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-touchStartX;
      const dy=e.changedTouches[0].clientY-touchStartY;
      if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
        if(dx<0)lbGo(1);
        else lbGo(-1);
      }
    },{passive:true});
  })();

  /* ─────────────────────────────────────
     초기화
  ───────────────────────────────────── */
  async function init(){
    const [works,exhibitions]=await Promise.all([
      sb('works'),
      sb('exhibitions')
    ]);

    WORKS=works||[];
    EXHIBITIONS=exhibitions||[];
    ALL_WORKS=sortWorksByYearDesc(WORKS);

    renderWorks();
    showPage(pageFromHash(),false);

    await Promise.all([
      loadCv(),
      loadContact()
    ]);
  }

  init();
</script>
</body>
</html>
